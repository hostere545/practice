<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrolling Text Word Picker</title>
<style>
  :root{
    --bg:#0f172a;
    --panel:#1e293b;
    --accent:#38bdf8;
    --accent2:#f472b6;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --border:#334155;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', system-ui, sans-serif;
    background:linear-gradient(160deg,#0f172a,#1e293b 60%,#0f172a);
    color:var(--text);
    min-height:100vh;
    padding:24px;
  }
  h1{
    text-align:center;
    font-size:1.5rem;
    margin-bottom:20px;
    color:var(--accent);
    letter-spacing:0.5px;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.3);
  }
  textarea{
    width:100%;
    min-height:110px;
    background:#0f172a;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    font-size:1rem;
    resize:vertical;
    outline:none;
  }
  textarea:focus{border-color:var(--accent);}
  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:14px;
    margin-top:14px;
  }
  button{
    background:var(--accent);
    color:#0f172a;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    cursor:pointer;
    font-size:0.95rem;
    transition:transform .15s ease, background .2s ease;
  }
  button:hover{transform:translateY(-2px);}
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
  }
  button.danger{
    background:var(--accent2);
    color:#1e0a13;
  }
  .speed-box{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:220px;
  }
  .speed-box label{
    font-size:0.85rem;
    color:var(--muted);
    white-space:nowrap;
  }
  input[type=range]{
    flex:1;
    accent-color:var(--accent);
  }
  #speedVal{
    font-size:0.85rem;
    color:var(--accent);
    min-width:60px;
    text-align:right;
  }
  .marquee-outer{
    position:relative;
    overflow:hidden;
    background:#0b1220;
    border:1px solid var(--border);
    border-radius:12px;
    height:70px;
  }
  #marqueeCanvas{
    display:block;
    width:100%;
    height:100%;
    cursor:pointer;
  }
  .hint{
    font-size:0.8rem;
    color:var(--muted);
    margin-top:8px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    margin-top:6px;
  }
  th, td{
    text-align:left;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    font-size:0.95rem;
  }
  th{
    color:var(--accent);
    font-size:0.8rem;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  tr:hover td{background:rgba(56,189,248,0.06);}
  .empty-row td{
    color:var(--muted);
    text-align:center;
    padding:20px;
    font-style:italic;
  }
  .table-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .badge{
    background:var(--accent);
    color:#0f172a;
    border-radius:999px;
    padding:2px 10px;
    font-size:0.8rem;
    font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📜 স্ক্রলিং টেক্সট ওয়ার্ড পিকার</h1>

  <div class="card">
    <textarea id="inputText" placeholder="এখানে আপনার টেক্সট পেস্ট করুন..."></textarea>
    <div class="controls">
      <button id="startBtn">▶ শুরু করুন</button>
      <button id="pauseBtn" class="secondary">⏸ থামান</button>
      <button id="reverseBtn" class="secondary">◀ উল্টো দিকে (ডানে) পাঠান</button>
      <button id="resetBtn" class="danger">⟲ রিসেট</button>
      <div class="speed-box">
        <label for="speed">গতি</label>
        <input type="range" id="speed" min="10" max="2000" value="80">
        <span id="speedVal">80 px/s</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="marquee-outer" id="marqueeOuter">
      <canvas id="marqueeCanvas"></canvas>
    </div>
    <p class="hint">চলন্ত টেক্সট থেকে যেকোনো শব্দে ক্লিক করুন — নিচের টেবিলে যোগ হয়ে যাবে। (বিশাল টেক্সটেও (লাখ শব্দ) হালকা থাকার জন্য এখন Canvas দিয়ে শুধু দৃশ্যমান অংশটুকু আঁকা হয়।)</p>
  </div>

  <div class="card">
    <div class="table-header">
      <h3 style="margin:0;color:var(--text);">নির্বাচিত শব্দসমূহ</h3>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="exportBtn" class="secondary" style="padding:6px 12px;font-size:0.8rem;">⬇ Export</button>
        <button id="importBtn" class="secondary" style="padding:6px 12px;font-size:0.8rem;">⬆ Import</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
        <span class="badge" id="countBadge">0</span>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>শব্দ</th><th>সময়</th><th></th></tr>
      </thead>
      <tbody id="tableBody">
        <tr class="empty-row"><td colspan="4">এখনো কোনো শব্দ নির্বাচন করা হয়নি</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const inputText = document.getElementById('inputText');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const reverseBtn = document.getElementById('reverseBtn');
const resetBtn = document.getElementById('resetBtn');
const speed = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const marqueeOuter = document.getElementById('marqueeOuter');
const canvas = document.getElementById('marqueeCanvas');
const ctx = canvas.getContext('2d');
const tableBody = document.getElementById('tableBody');
const countBadge = document.getElementById('countBadge');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');

const WORD_FONT = "600 20px 'Segoe UI', system-ui, sans-serif";
const TEXT_COLOR = '#e2e8f0';
const HOVER_COLOR = '#38bdf8';
const PICKED_COLOR = '#f472b6';

let pickedWords = [];
let wordData = [];      // [{word, x, width}] sorted by x, precomputed once
let totalWidth = 0;
let scrollX = 0;        // position (in CSS px) of "x=0" of wordData relative to canvas left edge
let direction = -1;     // -1 = moving left, 1 = moving right
let running = false;
let canvasWidthCss = 0;
let canvasHeightCss = 0;
let dpr = window.devicePixelRatio || 1;
let lastFrameTime = null;
let hoverIndex = -1;
let highlightIndex = -1;
let highlightUntil = 0;
let mouseX = null; // last known mouse x within canvas (CSS px), or null if not hovering

speed.addEventListener('input', () => {
  speedVal.textContent = speed.value + ' px/s';
});

function setupCanvasSize(){
  canvasWidthCss = marqueeOuter.clientWidth;
  canvasHeightCss = marqueeOuter.clientHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(canvasWidthCss * dpr));
  canvas.height = Math.max(1, Math.round(canvasHeightCss * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Precompute word positions ONCE. Drawing later only touches the visible slice,
// so this stays fast even with 100,000+ words.
function buildWordData(text){
  const words = text.split(/\s+/).filter(w => w.length > 0);
  ctx.font = WORD_FONT;
  const spacing = 22; // px between words (approx padding+margin look)
  let x = 0;
  const data = new Array(words.length);
  for(let i = 0; i < words.length; i++){
    const w = words[i];
    const width = ctx.measureText(w).width;
    data[i] = {word: w, x: x, width: width};
    x += width + spacing;
  }
  return {data, totalWidth: Math.max(0, x - spacing)};
}

function buildTrack(){
  const text = inputText.value.trim();
  wordData = [];
  totalWidth = 0;
  hoverIndex = -1;
  highlightIndex = -1;
  if(!text) return;

  setupCanvasSize();
  const built = buildWordData(text);
  wordData = built.data;
  totalWidth = built.totalWidth;

  // start position: text begins fully to the right of the visible box
  scrollX = canvasWidthCss;
}

// Binary search: first index whose [x, x+width) range could still be visible
// at or after viewStart (i.e. first index with x+width > viewStart).
function lowerBoundVisible(viewStart){
  let lo = 0, hi = wordData.length;
  while(lo < hi){
    const mid = (lo + hi) >> 1;
    if(wordData[mid].x + wordData[mid].width <= viewStart){
      lo = mid + 1;
    }else{
      hi = mid;
    }
  }
  return lo;
}

// Binary search: index of the word containing textX, or -1.
function findWordAt(textX){
  let lo = 0, hi = wordData.length - 1;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    const w = wordData[mid];
    if(textX < w.x){
      hi = mid - 1;
    }else if(textX > w.x + w.width){
      lo = mid + 1;
    }else{
      return mid;
    }
  }
  return -1;
}

function draw(){
  ctx.clearRect(0, 0, canvasWidthCss, canvasHeightCss);
  if(wordData.length === 0) return;

  const viewStart = -scrollX;
  const viewEnd = canvasWidthCss - scrollX;

  // recompute hover index each frame (cheap: O(log n)) since text moves under a fixed cursor
  if(mouseX !== null){
    hoverIndex = findWordAt(mouseX - scrollX);
  }else{
    hoverIndex = -1;
  }

  const highlightActive = performance.now() < highlightUntil;

  ctx.font = WORD_FONT;
  ctx.textBaseline = 'middle';
  const midY = canvasHeightCss / 2;

  let idx = lowerBoundVisible(viewStart);
  while(idx < wordData.length && wordData[idx].x < viewEnd){
    const w = wordData[idx];
    const drawX = w.x + scrollX;
    if(highlightActive && idx === highlightIndex){
      ctx.fillStyle = PICKED_COLOR;
    }else if(idx === hoverIndex){
      ctx.fillStyle = HOVER_COLOR;
    }else{
      ctx.fillStyle = TEXT_COLOR;
    }
    ctx.fillText(w.word, drawX, midY);
    idx++;
  }
}

function pickWord(index){
  const w = wordData[index];
  if(!w) return;
  highlightIndex = index;
  highlightUntil = performance.now() + 400;

  pickedWords.push(w.word);
  saveToStorage();
  renderTable();
}

function renderTable(){
  countBadge.textContent = pickedWords.length;
  if(pickedWords.length === 0){
    tableBody.innerHTML = '<tr class="empty-row"><td colspan="4">এখনো কোনো শব্দ নির্বাচন করা হয়নি</td></tr>';
    return;
  }
  tableBody.innerHTML = pickedWords.map((w, i) => {
    const time = new Date().toLocaleTimeString('bn-BD');
    return `<tr>
      <td>${i+1}</td>
      <td>${w}</td>
      <td>${time}</td>
      <td><button class="secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="removeWord(${i})">✕</button></td>
    </tr>`;
  }).join('');
}

function removeWord(index){
  pickedWords.splice(index, 1);
  saveToStorage();
  renderTable();
}
window.removeWord = removeWord;

const STORAGE_KEY = 'wordPickerSavedWords';

function saveToStorage(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pickedWords));
  }catch(e){
    console.warn('localStorage save failed:', e);
  }
}

function loadFromStorage(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      pickedWords = JSON.parse(saved);
    }
  }catch(e){
    console.warn('localStorage load failed:', e);
  }
}

function clearStorage(){
  try{
    localStorage.removeItem(STORAGE_KEY);
  }catch(e){
    console.warn('localStorage clear failed:', e);
  }
}

// restore any previously saved words on page load
loadFromStorage();
renderTable();

exportBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(pickedWords, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'picked-words.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

importBtn.addEventListener('click', () => {
  importFile.click();
});

importFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const imported = JSON.parse(evt.target.result);
      if(Array.isArray(imported)){
        pickedWords = pickedWords.concat(imported);
        saveToStorage();
        renderTable();
      }else{
        alert('ফাইলের ফরম্যাট সঠিক নয়।');
      }
    }catch(err){
      alert('ফাইল পড়তে সমস্যা হয়েছে।');
    }
    importFile.value = '';
  };
  reader.readAsText(file);
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouseX = e.clientX - rect.left;
});

canvas.addEventListener('mouseleave', () => {
  mouseX = null;
});

canvas.addEventListener('click', (e) => {
  if(wordData.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const idx = findWordAt(clickX - scrollX);
  if(idx >= 0){
    pickWord(idx);
  }
});

function renderLoop(timestamp){
  if(lastFrameTime === null) lastFrameTime = timestamp;
  let dt = (timestamp - lastFrameTime) / 1000;
  if(dt > 0.05) dt = 0.05;
  lastFrameTime = timestamp;

  if(running && wordData.length > 0){
    const pxPerSecond = parseFloat(speed.value);
    scrollX += direction * pxPerSecond * dt;

    if(direction === -1 && scrollX <= -totalWidth){
      scrollX = -totalWidth;
      running = false;
    }else if(direction === 1 && scrollX >= canvasWidthCss){
      scrollX = canvasWidthCss;
      running = false;
    }
  }

  draw();
  requestAnimationFrame(renderLoop);
}
requestAnimationFrame(renderLoop);

startBtn.addEventListener('click', () => {
  const finished = totalWidth > 0 && scrollX <= -totalWidth;
  if(wordData.length === 0 || finished){
    buildTrack();
  }
  direction = -1;
  running = true;
  lastFrameTime = null;
});

reverseBtn.addEventListener('click', () => {
  if(wordData.length === 0) return;
  direction = direction === -1 ? 1 : -1;
  running = true;
  lastFrameTime = null;
});

pauseBtn.addEventListener('click', () => {
  running = false;
});

resetBtn.addEventListener('click', () => {
  running = false;
  wordData = [];
  totalWidth = 0;
  scrollX = 0;
  direction = -1;
  hoverIndex = -1;
  highlightIndex = -1;
  inputText.value = '';
  pickedWords = [];
  clearStorage();
  renderTable();
});

window.addEventListener('resize', () => {
  setupCanvasSize();
});
</script>
</body>
</html>
